<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillX Institute | Free Online Academy for AI & Digital Skills</title>
<meta name="description" content="SkillX is a digital institute of technology: free live online courses in AI and digital skills, taught every night at 8:30 PM PKT.">
<link rel="icon" href="./assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- Fonts load WITHOUT blocking first paint (same fonts, async CSS):
     preload + rel swap, with a noscript fallback. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet"></noscript>
<script>try{var t=localStorage.getItem('skillx-react-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
